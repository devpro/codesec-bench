version: '3'

vars:
  SAMPLES:
    sh: ls -d samples/*/ 2>/dev/null | xargs -n1 basename | tr '\n' ' '
  TOOLS: semgrep-community semgrep-custom opengrep codeql trivy bandit

tasks:
  default:
    cmds:
      - task --list

  validate:
    desc: Check every case manifest against the schema, the files and the line anchors
    cmds:
      - node scripts/validate_cases.mjs

  scan:
    desc: Run every tool against every sample
    cmds:
      - for: {var: SAMPLES}
        task: scan:sample
        vars: {SAMPLE: '{{.ITEM}}'}

  scan:sample:
    desc: Run every tool against one sample (SAMPLE=<id>)
    requires:
      vars: [SAMPLE]
    cmds:
      - for: {var: TOOLS}
        cmd: ./scripts/run_scan.sh {{.SAMPLE}} {{.ITEM}}

  scan:one:
    desc: Run a single tool against a single sample (SAMPLE=<id> TOOL=<tool>)
    requires:
      vars: [SAMPLE, TOOL]
    cmds:
      - ./scripts/run_scan.sh {{.SAMPLE}} {{.TOOL}}

  score:
    desc: Score the SARIF files of the last scan against the case manifests and write report/summary.md
    cmds:
      - node scripts/score.mjs
      - node scripts/render_summary.mjs

  report:
    desc: "Validate the cases, run every tool against every sample, and write report/summary.md"
    cmds:
      - task: validate
      - task: scan
      - task: score

  clean:
    desc: Remove the output of the scans and the report
    cmds:
      - rm -f samples/*/.scan.sarif
      - rm -rf samples/*/.scannerwork report
