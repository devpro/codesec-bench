id: java-spring
title: Spring Boot reporting service, five cases across the difficulty ladder
language: java
language_version: "21"
framework: Spring Boot 3
runnable: false

# Paths a scanner is pointed at, relative to the sample root.
scan_roots:
  - src

# Tools that apply to this sample, with the arguments each one needs.
# A tool absent from this map is skipped for this sample.
# The community column is configured at its broadest, so that a miss cannot be blamed on rule selection.
tools:
  semgrep-community:
    - --config=p/default
    - --config=p/java
    # p/spring is deliberately absent: the registry returns 404 for it, exactly as it does for p/express.
    - --config=p/secrets
    - --config=p/owasp-top-ten
