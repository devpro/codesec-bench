id: php-symfony
title: Symfony 7.4 HTTP client wrapper
language: php
language_version: "8.3"
framework: Symfony 7.4
runnable: true

# Paths a scanner is pointed at, relative to the sample root.
scan_roots:
  - src

# Tools that apply to this sample, with the arguments each one needs.
# A tool absent from this map is skipped for this sample.
# The community column is measured at its broadest rather than at its narrowest, so that a zero here cannot be blamed on a stingy rule selection.
# p/default, p/secrets and p/owasp-top-ten add nothing on this sample: the result is zero with the language pack alone and zero with all five.
tools:
  semgrep-community:
    - --config=p/default
    - --config=p/php
    - --config=p/secrets
    - --config=p/owasp-top-ten
  semgrep-custom:
    - --config=.semgrep/rules.yaml
  opengrep:
    - --config=.semgrep/rules.yaml
