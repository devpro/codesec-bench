id: typescript-express
title: Express reporting service in TypeScript, five cases across the difficulty ladder
language: typescript
language_version: "5.6"
framework: Express 4
runnable: true

# Paths a scanner is pointed at, relative to the sample root.
scan_roots:
  - src

# Tools that apply to this sample, with the arguments each one needs.
# A tool absent from this map is skipped for this sample.
# The community column is configured at its broadest, so that a miss cannot be blamed on rule selection.
tools:
  semgrep-community:
    - --config=p/default
    - --config=p/typescript
    - --config=p/javascript
    - --config=p/nodejs
    # p/express is deliberately absent: the registry returns 404 for it, and one unresolvable pack makes Semgrep abort the entire scan.
    - --config=p/secrets
    - --config=p/owasp-top-ten
