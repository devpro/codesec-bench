id: dotnet-aspnet
title: ASP.NET Core reporting service, five cases across the difficulty ladder
language: csharp
language_version: "12"
framework: ASP.NET Core 8
codeql_language: csharp
runnable: false

# Paths a scanner is pointed at, relative to the sample root.
scan_roots:
  - src

# Tools that apply to this sample, with the arguments each one needs.
# A tool absent from this map is skipped for this sample.
# Every pack listed here was verified to resolve, after p/express and p/spring both turned out to be 404s.
tools:
  codeql:
    - codeql/csharp-queries:codeql-suites/csharp-security-extended.qls
  semgrep-community:
    - --config=p/default
    - --config=p/csharp
    - --config=p/secrets
    - --config=p/owasp-top-ten
