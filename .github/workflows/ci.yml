name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  TASK_VERSION: v3.52.0

jobs:
  validate:
    name: Validate manifests and check the matrix is current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
        with:
          task-version: ${{ env.TASK_VERSION }}

      # Validation catches a manifest whose line anchors have drifted away from the code.
      # Scoring runs against the committed SARIF files rather than rescanning, so this job needs no scanners and stays fast.
      # The diff check is what stops docs/matrix.md from drifting away from the results it claims to summarise.
      - name: Validate and score
        run: task check

  scan:
    name: Rescan and compare against the committed results
    runs-on: ubuntu-latest
    # Scanner versions and upstream rule packs move independently of this repository, so drift here is informative rather than a build break.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
        with:
          task-version: ${{ env.TASK_VERSION }}

      # Scanners are installed as binaries rather than run as container images, matching how they run locally.
      - name: Install scanners
        run: |
          pipx install semgrep
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "${HOME}/.opengrep/cli/latest" >> "${GITHUB_PATH}"

      - name: Scan and score
        run: |
          task scan
          task score

      # The versions on the runner differ from the versions that produced the committed results, so a diff is expected and is the point of the job.
      - name: Report drift against the committed results
        run: git diff --stat -- results docs/matrix.md
