name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate the cases
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      # Every case manifest against the schema, the files it names and its line anchors, which drift when the code moves.
      custom-tests: node scripts/validate_cases.mjs
      job-name: Validate the cases
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de

  scan:
    name: Run every tool against every sample
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Task
        uses: devpro/github-workflow-parts/actions/task/setup@591b0c7bfba6fbc7b0cab7d896447e0732b819de
      # Each tool at the version its install pins, its download checked against a SHA256, rather than the latest one or a script run from a branch.
      - name: Install Semgrep and Bandit
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-hashes -r tools/requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
      - name: Install Opengrep
        uses: devpro/github-workflow-parts/actions/opengrep/setup@591b0c7bfba6fbc7b0cab7d896447e0732b819de
      - name: Install Trivy
        uses: devpro/github-workflow-parts/actions/trivy/setup@591b0c7bfba6fbc7b0cab7d896447e0732b819de
      - name: Install CodeQL
        uses: devpro/github-workflow-parts/actions/codeql/setup@591b0c7bfba6fbc7b0cab7d896447e0732b819de
      - name: Scan and score
        run: task report
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: report/
